<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Important Question ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffeef5);
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      position: relative;
      z-index: 2;
    }

    .dog {
      font-size: 100px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      color: #ff4f87;
      font-size: 24px;
      margin: 15px 0;
    }

    p {
      font-size: 20px;
      color: #444;
      font-weight: bold;
      line-height: 1.5;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 18px;
      position: relative;
      min-height: 60px;
    }

    button {
      border: none;
      padding: 14px 25px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #yes {
      background: #ff4f87;
      color: white;
    }

    #yes:hover {
      transform: scale(1.1);
    }

    #no {
      background: #eeeeee;
      color: #444;
    }

    .heart {
      position: fixed;
      font-size: 25px;
      animation: fall 5s linear infinite;
      top: -30px;
      z-index: 1;
    }

    @keyframes fall {
      from {
        transform: translateY(-30px);
        opacity: 1;
      }
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    #success {
      display: none;
    }

    .ring {
      font-size: 90px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% { transform: scale(1.15); }
    }

    .love {
      color: #ff4f87;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card" id="question">

    <div class="dog">🐶</div>

    <h1>I have one important question... ❤️</h1>

    <p>
      Tu majhya shi lagna karsheel ka? 💍❤️
    </p>

    <div class="buttons">
      <button id="yes" onclick="sayYes()">YES ❤️</button>
      <button id="no" onclick="runAway()">NO 😏</button>
    </div>

  </div>

  <div class="card" id="success">

    <div class="ring">💍</div>

    <h1>Yessssss! ❤️🥹</h1>

    <p>
      I knew you would say YES! 🥰
    </p>

    <div class="love">
      Forever & Always ❤️
    </div>

    <div style="font-size:70px; margin-top:15px;">
      🐶💕👩‍❤️‍👨
    </div>

  </div>

  <script>

    function sayYes() {
      document.getElementById("question").style.display = "none";
      document.getElementById("success").style.display = "block";

      for (let i = 0; i < 30; i++) {
        createHeart();
      }
    }

    function runAway() {
      const noButton = document.getElementById("no");

      const maxX = window.innerWidth - 120;
      const maxY = window.innerHeight - 80;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noButton.style.position = "fixed";
      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = ["❤️","💕","💖","💗","💘"][Math.floor(Math.random() * 5)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createHeart, 800);

  </script>

</body>
</html>
